# Install on the INDEPENDENT JOURNAL HOST. Restrict its firewall to the API host.
# Replace domain/certificate paths. The signing key never belongs on the API host.
server {
    listen 443 ssl;
    server_name journal.example.invalid;
    ssl_certificate /etc/letsencrypt/live/journal.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journal.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
