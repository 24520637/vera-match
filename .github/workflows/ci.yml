name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Validate Prisma (requires DATABASE_URL for CLI parsing)
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/vera?schema=public
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/vera?schema=public
      - run: npm run test
      - run: npm run build
      - name: Start native PostgreSQL 18 (no Docker)
        shell: bash
        run: |
          if [[ ! -x /usr/lib/postgresql/18/bin/pg_ctl ]]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common ca-certificates curl
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            source /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/vera-pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-18
          fi
          if pg_lsclusters --no-header | awk '$1 == "18" && $2 == "main" && $4 ~ /^online/ { found = 1 } END { exit !found }'; then
            sudo pg_ctlcluster 18 main stop
          fi
          /usr/lib/postgresql/18/bin/initdb -D "$RUNNER_TEMP/vera-postgres" --username=vera_ci --auth-local=trust --auth-host=trust
          if ! /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/vera-postgres" -l "$RUNNER_TEMP/vera-postgres.log" -o "-h 127.0.0.1 -p 5433 -k $RUNNER_TEMP" -w start; then
            cat "$RUNNER_TEMP/vera-postgres.log"
            exit 1
          fi
          /usr/lib/postgresql/18/bin/createdb -h 127.0.0.1 -p 5433 -U vera_ci vera_t01_test
      - name: Start native Mailpit (loopback only, no Docker)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vera-mailpit"
          curl --fail --location --retry 3 https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-amd64.tar.gz -o "$RUNNER_TEMP/vera-mailpit/mailpit.tar.gz"
          echo "84d7fe375ebef25df26758984dc0d5d5e17d8c0734cb2e77be7873b14ab51716  $RUNNER_TEMP/vera-mailpit/mailpit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vera-mailpit/mailpit.tar.gz" -C "$RUNNER_TEMP/vera-mailpit"
          "$RUNNER_TEMP/vera-mailpit/mailpit" --listen 127.0.0.1:8025 --smtp 127.0.0.1:1025 > "$RUNNER_TEMP/vera-mailpit.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vera-mailpit.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8025/livez; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vera-mailpit.log"
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build and start pinned native MinIO (loopback only, no Docker)
        shell: bash
        env:
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3100,http://127.0.0.1:3100
        run: |
          git clone --depth 1 --branch RELEASE.2025-10-15T17-29-55Z https://github.com/minio/minio.git "$RUNNER_TEMP/vera-minio-source"
          test "$(git -C "$RUNNER_TEMP/vera-minio-source" rev-parse HEAD)" = "9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a"
          (cd "$RUNNER_TEMP/vera-minio-source" && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/vera-minio" .)
          mkdir -p "$RUNNER_TEMP/vera-minio-data"
          "$RUNNER_TEMP/vera-minio" server "$RUNNER_TEMP/vera-minio-data" --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 --quiet > "$RUNNER_TEMP/vera-minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vera-minio.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Apply existing migrations to disposable CI database
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
      - name: Verify synthetic PostgreSQL backup and isolated restore
        run: npm run test:ops
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          C095_EVIDENCE_DIR: ${{ runner.temp }}
      - name: Prepare native media decoder for integrated privacy tests
        shell: bash
        run: |
          if ! command -v ffprobe || ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          echo "VIDEO_DURATION_FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"
      - name: Verify authentication and PostgreSQL foundation
        run: npm run test:integration --workspace apps/api
        env:
          NODE_ENV: test
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
      - name: Install browser for shared UI checks
        run: npx playwright install --with-deps chromium
      - name: Check shared UI interactions and accessibility
        run: npm run test:ui --workspace apps/web
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
      - name: Verify real registration, SMTP activation and browser sessions
        run: npm run test:auth --workspace apps/web
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
      - name: Verify member settings against real API on desktop and mobile
        run: node scripts/run-member-e2e.cjs
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/member
      - name: Verify native background-tab matching revocation
        shell: bash
        run: |
          if ! command -v xvfb-run; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a node scripts/run-member-e2e.cjs --headed --grep="members accept"
        env:
          VERA_NATIVE_BACKGROUND_E2E: "1"
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/native-background
      - name: Verify safety flows against real API on desktop and mobile
        run: node scripts/run-safety-e2e.cjs
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/safety
      - name: Verify private video against native MinIO and real API
        shell: bash
        run: |
          if ! command -v ffprobe || ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          export VIDEO_DURATION_FFPROBE="$(command -v ffprobe)"
          test -n "$VIDEO_DURATION_FFPROBE"
          npm test --workspace apps/api -- --runInBand video-duration
          node scripts/run-video-e2e.cjs
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/video
      - name: Verify disposable HTTPS cookies and proxy boundaries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl
          npm run test:https --workspace apps/web
        env:
          DATABASE_URL: postgresql://vera_ci:synthetic-ci-only@127.0.0.1:5433/vera_t01_test?schema=public
          MINIO_ROOT_USER: synthetic-ci
          MINIO_ROOT_PASSWORD: synthetic-ci-only-not-a-secret
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
      - name: Save UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/**/private-video-review.png
          retention-days: 7
      - name: Stop native CI Mailpit
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/vera-mailpit.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/vera-mailpit.pid")"
          fi
      - name: Stop native CI MinIO
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/vera-minio.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/vera-minio.pid")"
          fi
      - name: Stop native CI PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/vera-postgres/postmaster.pid" ]]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/vera-postgres" -m fast -w stop
          fi
